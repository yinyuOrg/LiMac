---
- name: Setup Debian development environment
  hosts: localhost
  connection: local
  gather_facts: yes

  vars_files:
    - vars/default.yml

  vars:
    apt_arch_map:
      x86_64: amd64
      aarch64: arm64
    apt_arch: "{{ apt_arch_map[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"
    # 选当前架构对应的 WeChat deb URL；不支持的架构会变成空，相应任务由 when 跳过
    wechat_deb_url: "{{ wechat_deb_urls[ansible_facts['architecture']] | default('') }}"

  pre_tasks:
    - name: Fail on non-Debian systems
      ansible.builtin.fail:
        msg: "此 playbook 仅支持 Debian/Ubuntu 系统"
      when: ansible_facts['os_family'] != "Debian"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      become: yes

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - ca-certificates
        state: present
      become: yes

    - name: Remove legacy .list repositories
      ansible.builtin.file:
        path: "{{ item.legacy_list }}"
        state: absent
      loop: "{{ apt_repos }}"
      become: yes

    - name: Add repository GPG keys
      ansible.builtin.get_url:
        url: "{{ item.key_url }}"
        dest: "{{ item.key_dest }}"
        mode: '0644'
      loop: "{{ apt_repos }}"
      become: yes

    - name: Add APT repositories
      ansible.builtin.deb822_repository:
        name: "{{ item.name }}"
        types: deb
        uris: "{{ item.uris }}"
        suites: "{{ item.suites }}"
        components: "{{ item.components }}"
        signed_by: "{{ item.key_dest }}"
        state: present
        enabled: true
      loop: "{{ apt_repos }}"
      become: yes

    - name: Update apt cache after adding all repositories
      ansible.builtin.apt:
        update_cache: yes
      become: yes

    - name: Install APT repository packages
      ansible.builtin.apt:
        name: "{{ item.packages }}"
        state: present
      loop: "{{ apt_repos }}"
      when: item.arches is not defined or apt_arch in item.arches
      become: yes

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        groups: docker
        append: yes
      become: yes

    - name: Install WeChat
      block:
        - name: Download WeChat .deb
          ansible.builtin.get_url:
            url: "{{ wechat_deb_url }}"
            dest: /tmp/wechat.deb
            mode: '0644'

        - name: Install WeChat from local .deb
          ansible.builtin.apt:
            deb: /tmp/wechat.deb
            state: present
      rescue:
        - name: Warn on WeChat install failure
          ansible.builtin.debug:
            msg: "WeChat 安装失败，请检查网络或架构支持。"
      always:
        - name: Clean up downloaded WeChat .deb
          ansible.builtin.file:
            path: /tmp/wechat.deb
            state: absent
      become: yes
      when: wechat_deb_url != ""

    - name: Fix possible broken dependencies after installing third-party .deb packages
      ansible.builtin.apt:
        state: fixed
      become: yes