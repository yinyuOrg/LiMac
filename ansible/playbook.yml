---
- name: Setup Debian 13 development environment
  hosts: localhost
  connection: local
  gather_facts: yes

  vars_files:
    - vars/default.yml

  vars:
    apt_arch_map:
      x86_64: amd64
      aarch64: arm64
    apt_arch: "{{ apt_arch_map[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"

  pre_tasks:
    - name: Fail on non-Debian systems
      ansible.builtin.fail:
        msg: "此 playbook 仅支持 Debian/Ubuntu 系统"
      when: ansible_facts['os_family'] != "Debian"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      become: yes

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - ca-certificates
        state: present
      become: yes

    - name: Install Docker
      block:
        - name: Remove legacy Docker .list repository
          ansible.builtin.file:
            path: /etc/apt/sources.list.d/docker.list
            state: absent

        - name: Add Docker GPG key
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/debian/gpg
            dest: /usr/share/keyrings/docker.asc
            mode: '0644'

        - name: Add Docker APT repository
          ansible.builtin.deb822_repository:
            name: docker
            types: deb
            uris: https://download.docker.com/linux/debian
            suites: "{{ ansible_facts['distribution_release'] }}"
            components: stable
            signed_by: /usr/share/keyrings/docker.asc
            state: present
            enabled: true

        - name: Update apt cache after adding Docker repository
          ansible.builtin.apt:
            update_cache: yes

        - name: Install Docker packages
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present

        - name: Add user to docker group
          ansible.builtin.user:
            name: "{{ ansible_facts['user_id'] }}"
            groups: docker
            append: yes
      become: yes

    - name: Install Google Chrome
      block:
        - name: Remove legacy Google Chrome .list repository
          ansible.builtin.file:
            path: /etc/apt/sources.list.d/google-chrome.list
            state: absent

        - name: Add Google GPG key
          ansible.builtin.get_url:
            url: https://dl.google.com/linux/linux_signing_key.pub
            dest: /usr/share/keyrings/google-chrome.asc
            mode: '0644'

        - name: Add Google Chrome repository
          ansible.builtin.deb822_repository:
            name: google-chrome
            types: deb
            uris: https://dl.google.com/linux/chrome/deb/
            suites: stable
            components: main
            signed_by: /usr/share/keyrings/google-chrome.asc
            state: present
            enabled: true

        - name: Update apt cache after adding Google Chrome repository
          ansible.builtin.apt:
            update_cache: yes

        - name: Install Google Chrome
          ansible.builtin.apt:
            name: google-chrome-stable
            state: present
      become: yes

    - name: Install VSCode
      block:
        - name: Remove legacy VSCode .list repository
          ansible.builtin.file:
            path: /etc/apt/sources.list.d/vscode.list
            state: absent

        - name: Add Microsoft GPG key
          ansible.builtin.get_url:
            url: https://packages.microsoft.com/keys/microsoft.asc
            dest: /usr/share/keyrings/microsoft.asc
            mode: '0644'

        - name: Add VSCode APT repository
          ansible.builtin.deb822_repository:
            name: vscode
            types: deb
            uris: https://packages.microsoft.com/repos/code
            suites: stable
            components: main
            signed_by: /usr/share/keyrings/microsoft.asc
            state: present
            enabled: true

        - name: Update apt cache after adding VSCode repository
          ansible.builtin.apt:
            update_cache: yes

        - name: Install VSCode
          ansible.builtin.apt:
            name: code
            state: present
      become: yes

    - name: Install WeChat
      block:
        - name: Download WeChat .deb
          ansible.builtin.get_url:
            url: "{{ wechat_deb_url }}"
            dest: /tmp/wechat.deb
            mode: '0644'

        - name: Install WeChat
          ansible.builtin.apt:
            deb: /tmp/wechat.deb
            state: present
      become: yes

    - name: Fix possible broken dependencies after installing third-party .deb packages
      ansible.builtin.apt:
        state: fixed
      become: yes
